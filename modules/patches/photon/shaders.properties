#file "/shaders.properties"

#replace "screen              = INFO <profile> <empty> <empty> [world] [lighting] [sky] [fog] [materials] [water] [post] [misc]"
photonics.supported = true

#ifdef TAAU
photonics.renderScale = TAAU_RENDER_SCALE
#endif

photonics.maxLights = MAX_LIGHTS
photonics.maxSamples = MAX_SAMPLES
photonics.alphaMode = ALPHA_MODE
photonics.enchantmentGlintStrength = ENCHANTMENT_GLINT_STRENGTH
photonics.useSeparateHandheldRays = SEPARATE_HANDHELD_RAYS

photonics.lightingMode = LIGHTING_MODE

photonics.restirInitialSamples = RESTIR_INITIAL_SAMPLES
photonics.restirSpatialReuseSamples = RESTIR_SPATIAL_REUSE_SAMPLES
photonics.restirSpatialReuseRadius = RESTIR_SPATIAL_REUSE_RADIUS
photonics.restirAccumulationFrames = RESTIR_ACCUMULATION_FRAMES
photonics.restirDenoiserPasses = RESTIR_DENOISER_PASSES
photonics.restirCombinedGi = RESTIR_COMBINED_GI

#ifndef RESTIR_SOFT_SHADOWS
photonics.restirSoftShadows = false
#endif


screen              = INFO <profile> PHOTONICS_ENABLED [photonics] <empty> <empty> [world] [lighting] [sky] [fog] [materials] [water] [post] [misc]

screen.photonics = ALPHA_MODE                     LIGHTING_MODE \
                   MAX_LIGHTS                     MAX_SAMPLES \
                   [reflections]                  ENCHANTMENT_GLINT_STRENGTH \
                   <empty>                        SEPARATE_HANDHELD_RAYS \
                   RESTIR_SOFT_SHADOWS            RESTIR_COMBINED_GI \
                   RESTIR_INITIAL_SAMPLES         RESTIR_SPATIAL_REUSE_SAMPLES \
                   RESTIR_ACCUMULATION_FRAMES     RESTIR_SPATIAL_REUSE_RADIUS \
                   RESTIR_DENOISER_PASSES         <empty>

screen.photonics.columns = 2
#endreplace

#replace "screen.reflections      = ENVIRONMENT_REFLECTIONS SKY_REFLECTIONS SSR_ROUGHNESS_SUPPORT <empty> SSR_RAY_COUNT SSR_INTERSECTION_STEPS_SMOOTH SSR_INTERSECTION_STEPS_ROUGH SSR_REFINEMENT_STEPS SSR_ROUGHNESS_THRESHOLD"
